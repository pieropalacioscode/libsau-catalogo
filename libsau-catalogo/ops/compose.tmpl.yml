# Plantilla del sitio de un cliente. deploy.sh la rellena con valores ya validados.
name: ladmincabo-web-@SLUG@
services:
  web:
    image: ladmincabo-web:@SLUG@
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:@PORT@:3000"
    mem_limit: @MEM_LIMIT@
    cpus: @CPUS@
    pids_limit: 200
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # Sin read_only: Next escribe en .next/server/app al regenerar páginas (revalidate 60 s).
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
